[package]
name = "crust_core"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "Core library to download, install and launch Minecraft (versions, assets, libraries, Java runtime, mod loaders)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Luuxis/CrustCore"
homepage = "https://github.com/Luuxis/CrustCore"
documentation = "https://docs.rs/crust_core"
keywords = ["minecraft", "launcher", "download", "java"]
categories = ["game-development", "api-bindings"]
include = ["src/**", "assets/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "crust_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
md-5 = "0.11.0"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }
url = "2.5.8"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
